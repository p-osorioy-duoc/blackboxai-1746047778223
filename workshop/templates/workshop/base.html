<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Mechanical Workshop{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-roboto min-h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><a href="{% url 'workshop:home' %}">Mechanical Workshop</a></h1>
            <nav>
                <a href="{% url 'workshop:owner_list' %}" class="mr-4 hover:underline">Owners</a>
                <a href="{% url 'workshop:vehicle_list' %}" class="mr-4 hover:underline">Vehicles</a>
            </nav>
        </div>
    </header>
    <main class="container mx-auto flex-grow p-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-blue-600 text-white p-4 text-center">
        &copy; 2024 Mechanical Workshop
    </footer>
</body>
</html>
