{% extends "workshop/base.html" %}
{% block title %}Add Vehicle - Mechanical Workshop{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Add Vehicle</h2>
<form method="post" class="max-w-md bg-white p-6 rounded shadow">
    {% csrf_token %}
    <label class="block mb-2">
        Owner:
        <select name="owner" required class="w-full border rounded p-2">
            <option value="">Select Owner</option>
            {% for owner in owners %}
            <option value="{{ owner.id }}">{{ owner.first_name }} {{ owner.last_name }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="block mb-2">
        Make:
        <input type="text" name="make" required class="w-full border rounded p-2" />
    </label>
    <label class="block mb-2">
        Model:
        <input type="text" name="model" required class="w-full border rounded p-2" />
    </label>
    <label class="block mb-2">
        Year:
        <input type="number" name="year" required min="1900" max="2100" class="w-full border rounded p-2" />
    </label>
    <label class="block mb-2">
        License Plate:
        <input type="text" name="license_plate" required class="w-full border rounded p-2" />
    </label>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mt-4">Add Vehicle</button>
</form>
{% endblock %}
